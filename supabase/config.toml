# Configuración del proyecto Supabase (versionada en el repo).
# No contiene secretos: solo el project_id público. Las claves (service_role,
# anon, JWT secret) viven en la plataforma / variables de entorno, nunca acá.
project_id = "lbtyxnbyetsvngsxczkt"

# URL canónica y destinos permitidos para los enlaces de autenticación.
# Supabase descarta `redirectTo` si no figura aquí y vuelve a la portada.
[auth]
site_url = "https://www.evolucionantoniana.com"
additional_redirect_urls = [
  "https://www.evolucionantoniana.com/update-password",
  "https://evolucionantoniana.com/update-password",
]

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[functions.create-user]
verify_jwt = true

# --- Club de beneficios, fase 2 (ROADMAP §12.5) ------------------------------
# Las tres exigen JWT: la identidad del invocador es la base de toda la
# autorizacion. Que sea socio o cajero se resuelve DENTRO de cada funcion
# leyendo la base con service_role, nunca del token ni del body.
[functions.club-generar-canje]
verify_jwt = true

[functions.club-confirmar-canje]
verify_jwt = true

[functions.club-anular-canje]
verify_jwt = true
